<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotina — GGE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div class="logo-mark" style="width:44px;height:44px;font-size:22px;border-radius:13px">R</div>
        <div>
          <div style="font-size:26px;font-weight:800;letter-spacing:-.02em">Rotina</div>
          <div style="font-size:12.5px;color:var(--muted)">GGE — sua rotina em dia</div>
        </div>
      </div>
      <p style="color:var(--muted);font-size:14px;margin:14px 0 4px;line-height:1.5">
        Bem-vindo! Entre com seu nome e sua senha.
      </p>
      <label class="f">Nome</label>
      <input id="nome" placeholder="Ex.: Talita" autocomplete="username" autofocus>
      <label class="f">Senha</label>
      <input id="senha" type="password" placeholder="Sua senha" autocomplete="current-password">
      <div id="erro" style="display:none;color:var(--red);font-size:13.5px;margin-top:12px;font-weight:600"></div>
      <button class="btn primary" id="entrar" style="width:100%;margin-top:20px;padding:12px;font-size:15px">Entrar</button>
      <div class="hint" style="text-align:center;margin-top:16px">Primeira vez? Sua senha inicial é seu nome seguido de 123.</div>
    </div>
  </div>
  <script>
    const sb = supabase.createClient(window.ROTINA_URL, window.ROTINA_KEY);
    // já logado? vai direto
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) location.href = 'dashboard.html';
    });
    async function entrar() {
      const nome = document.getElementById('nome').value.trim();
      const senha = document.getElementById('senha').value;
      const erro = document.getElementById('erro');
      erro.style.display = 'none';
      if (!nome || !senha) { erro.textContent = 'Preencha nome e senha.'; erro.style.display = 'block'; return; }
      const btn = document.getElementById('entrar');
      btn.disabled = true; btn.textContent = 'Entrando...';
      const email = nome.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '') + '@rotina.local';
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if (error) {
        erro.textContent = 'Nome ou senha incorretos. Confira e tente de novo.';
        erro.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Entrar';
        return;
      }
      location.href = 'dashboard.html';
    }
    document.getElementById('entrar').addEventListener('click', entrar);
    document.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  </script>
</body>
</html>
