<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipe — Rotina GGE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="shell"></div>
  <div class="main">
    <div class="page-head">
      <div class="page-title">Equipe</div>
      <div class="page-sub" id="sub">Quem está em dia e quem precisa de uma cobrança</div>
    </div>
    <div id="conteudo" class="loading">Carregando…</div>
  </div>
</div>
<script>
let status = [], atrasadas = [], semana = [], pessoaSel = null, ocorrSel = [];

async function carregar() {
  const hoje = R.hojeISO();
  const ids = R.gerenciaveis().map(p => p.id);
  const [r1, r2, r3] = await Promise.all([
    R.sb.from('vw_status_pessoas').select('*').in('id', ids),
    R.sb.from('vw_ocorrencias').select('*').eq('status', 'pendente').lte('data_prevista', hoje)
      .in('responsavel_id', ids).order('data_prevista'),
    R.sb.from('vw_ocorrencias').select('*').in('responsavel_id', ids)
      .gte('data_prevista', hoje).lte('data_prevista', R.addDias(hoje, 6))
  ]);
  status = (r1.data || []).filter(s => s.ativo);
  atrasadas = (r2.data || []).filter(o => o.atrasada);
  semana = r3.data || [];
}

function render() {
  const el = document.getElementById('conteudo');
  const ordem = { red: 0, orange: 1, yellow: 2, green: 3 };
  const lista = status.map(s => ({ ...s, cor: R.corDe(s.vencidas_abertas) }))
    .sort((a, b) => ordem[a.cor] - ordem[b.cor] || b.vencidas_abertas - a.vencidas_abertas || a.nome.localeCompare(b.nome));

  const totalVencidas = lista.reduce((t, s) => t + Number(s.vencidas_abertas), 0);
  const emDia = lista.filter(s => s.cor === 'green').length;

  let h = `<div class="grid grid-3" style="margin-bottom:22px">
    <div class="kpi"><div class="kpi-label">Pessoas em dia</div><div class="kpi-value" style="color:var(--green)">${emDia} de ${lista.length}</div></div>
    <div class="kpi"><div class="kpi-label">Pendências vencidas (equipe)</div><div class="kpi-value" style="color:${totalVencidas ? 'var(--red)' : 'var(--green)'}">${totalVencidas}</div></div>
    <div class="kpi"><div class="kpi-label">Tarefas na semana</div><div class="kpi-value">${semana.length}</div></div>
  </div>`;

  // cartões de pessoas
  h += `<div class="grid grid-2">`;
  lista.forEach(s => {
    const p = R.pessoa(s.id);
    const setores = R.setoresDe(s.id).map(x => x.nome).join(', ');
    const pct = calcPct(s);
    h += `<div class="card" style="cursor:pointer" onclick="verPessoa('${s.id}')">
      <div style="display:flex;align-items:center;gap:12px">
        <span class="dot ${s.ausente_hoje ? 'gray' : s.cor}" style="width:14px;height:14px"></span>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:15.5px">${R.esc(s.nome)}
            ${s.ausente_hoje ? '<span class="badge gray">ausente</span>' : ''}
            ${p.papel === 'admin' ? '<span class="badge blue">admin</span>' : ''}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${R.esc(setores || '—')}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:800;font-size:17px;color:${s.vencidas_abertas > 0 ? 'var(--red)' : 'var(--green)'}">${s.vencidas_abertas}</div>
          <div style="font-size:11px;color:var(--dim)">vencidas</div>
        </div>
      </div>
      <div class="task-meta" style="margin-top:10px">
        <span class="badge ${s.cor}">${R.corNome(s.cor)}</span>
        <span class="badge gray">${s.pendentes_hoje} para hoje</span>
        <span class="badge gray">${pct}% no prazo (30d)</span>
      </div>
    </div>`;
  });
  h += `</div>`;

  // carga da semana
  const max = Math.max(1, ...lista.map(s => semana.filter(o => o.responsavel_id === s.id).length));
  h += `<div class="card sec-gap"><div class="card-title">Carga da semana <span class="hint" style="margin:0;font-weight:400">— tarefas por pessoa nos próximos 7 dias</span></div>`;
  lista.forEach(s => {
    const n = semana.filter(o => o.responsavel_id === s.id).length;
    h += `<div class="bar-row"><div class="bar-name">${R.esc(s.nome)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(100 * n / max)}%"></div></div>
      <div class="bar-n">${n}</div></div>`;
  });
  h += `</div>`;

  // atrasos da equipe
  h += `<div class="day-group-title sec-gap"><span class="dot red"></span> Atrasos em aberto (${atrasadas.length})</div>`;
  h += atrasadas.length
    ? atrasadas.map(o => R.taskHTML(o, { mostrarPessoa: true, mostrarData: true })).join('')
    : `<div class="empty">Nenhum atraso na equipe. Excelente sinal.</div>`;

  h += `<div id="drill"></div>`;
  el.innerHTML = h;
}

function calcPct(s) {
  const feitas = Number(s.no_prazo_30d), atras = Number(s.com_atraso_30d), venc = Number(s.abertas_vencidas_30d);
  const base = feitas + atras + venc;
  return base ? Math.round(100 * feitas / base) : 100;
}

async function verPessoa(id) {
  pessoaSel = id;
  const hoje = R.hojeISO();
  const { data } = await R.sb.from('vw_ocorrencias').select('*')
    .eq('responsavel_id', id)
    .gte('data_prevista', R.addDias(hoje, -14)).lte('data_prevista', R.addDias(hoje, 14))
    .order('data_prevista');
  ocorrSel = data || [];
  const p = R.pessoa(id);
  const drill = document.getElementById('drill');
  let dia = '';
  let h = `<div class="day-group-title sec-gap"><span class="dot green"></span> Agenda de ${R.esc(p.nome)} — 14 dias para trás e para frente</div>`;
  if (!ocorrSel.length) h += '<div class="empty">Nada no período.</div>';
  ocorrSel.forEach(o => {
    if (o.data_prevista !== dia) { dia = o.data_prevista; h += `<div class="day-group-title">${R.fmtDia(dia)}</div>`; }
    h += R.taskHTML(o, { mostrarData: false });
  });
  drill.innerHTML = h;
  drill.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

window.recarregar = async () => { await carregar(); render(); if (pessoaSel) verPessoa(pessoaSel); };

(async function () {
  const ok = await R.init('equipe');
  if (!ok) return;
  if (!R.souAdmin && !R.souChefe) { location.href = 'dashboard.html'; return; }
  await carregar(); render();
})();
</script>
</body>
</html>
